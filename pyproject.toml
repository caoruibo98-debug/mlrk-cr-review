[project]
name = "ml-ranking-kernel-prod-candidate"
version = "0.1.0"
description = "Production-candidate shell for the food microbiome metabolite ranking kernel."
requires-python = ">=3.10"
dependencies = [
  "numpy==2.4.3",
  "pandas==3.0.1",
  "pyyaml==6.0.3",
  "rdkit==2025.9.6",
  "xgboost==3.2.0",
]

[project.optional-dependencies]
serve = [
  "fastapi==0.136.3",
  "pydantic==2.13.4",
  "uvicorn==0.48.0",
]
research = [
  "matplotlib==3.10.8",
  "pyarrow==23.0.1",
  "scikit-learn==1.8.0",
  "scipy==1.17.1",
]
test = [
  "pytest==9.0.3",
]

[project.scripts]
mlrk-prod = "mlrk_prod.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
